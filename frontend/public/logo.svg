<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F" />
      <stop offset="50%" stop-color="#D4755B" />
      <stop offset="100%" stop-color="#9C4128" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F4A261" />
      <stop offset="100%" stop-color="#E76F51" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D4755B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Emblem / Icon -->
  <g transform="translate(10, 10)" filter="url(#subtleGlow)">
    <!-- Base geometric shield / architectural facet -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#auraGrad)" />
    
    <!-- Modern Stylized Arch / 'A' Icon -->
    <path d="M30 13 L47 47 L38 47 L30 31 L22 47 L13 47 Z" fill="#FFFFFF" fill-opacity="0.95" />
    <path d="M30 22 L40 42 L34 42 L30 34 L26 42 L20 42 Z" fill="url(#goldAccent)" />
    
    <!-- Architectural Horizon line -->
    <rect x="23" y="38" width="14" height="2.5" rx="1.25" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <text x="84" y="44" font-family="'Fraunces', 'Syne', serif, sans-serif" font-size="28" font-weight="700" fill="#111827" letter-spacing="-0.5">
    Aura<tspan fill="#D4755B">Realty</tspan>
  </text>
  <text x="85" y="59" font-family="'Space Mono', 'Manrope', monospace, sans-serif" font-size="8.5" font-weight="600" fill="#9CA3AF" letter-spacing="3.2">
    INTELLIGENT LIVING
  </text>
</svg>